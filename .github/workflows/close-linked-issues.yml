# Close issues named by a closing keyword when a PR merges into dev.
#
# GitHub only acts on "Fixes #N" when a PR merges into the default branch, and
# this repo's default is the production branch: day-to-day work merges into
# dev. Without this, an issue the PR says it fixes stays open after the merge.
# Same-repo references only (#N or this-owner/this-repo#N): the workflow token
# cannot write to other repositories, and backlog issues live in the repo
# where their code lands.
name: close-linked-issues

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const text = `${pr.title}\n${pr.body || ''}`;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+(?:([\w.-]+)\/([\w.-]+))?#(\d+)\b/gi;
            const nums = new Set();
            for (const m of text.matchAll(re)) {
              if (m[1] && (m[1].toLowerCase() !== owner.toLowerCase() || m[2].toLowerCase() !== repo.toLowerCase())) continue;
              nums.add(Number(m[3]));
            }
            for (const n of nums) {
              if (n === pr.number) continue;
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
              if (issue.pull_request || issue.state === 'closed') continue;
              await github.rest.issues.createComment({ owner, repo, issue_number: n,
                body: `Closed by #${pr.number}, merged into \`dev\` as ${pr.merge_commit_sha.slice(0, 7)}.` });
              await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed', state_reason: 'completed' });
              core.info(`closed #${n}`);
            }
