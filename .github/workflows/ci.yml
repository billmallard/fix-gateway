# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "master", "dev", "qa" ]
  pull_request:


jobs:
  build:
    
    runs-on: ubuntu-latest
    permissions:
      # Needed to save data for comment
      pull-requests: write
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        # This is optional since by default it's to true. The git
        # operations in python-coverage-comment-action utilize the token
        # stored by actions/checkout.
        persist-credentials: true
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libegl1
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-qt pytest-env pytest-cov
        pip install -e .[qt,sim]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      id: pytest
      run: |
        # JUnit (xunit1 keeps each case's file and line) is the record the job summary
        # and pyEfis's test-evidence page are built from (TV11).
        pytest --junitxml=reports/junit.xml -o junit_family=xunit1

    - name: Test evidence record and job summary
      if: always() && steps.pytest.outcome != 'skipped'
      env:
        REF: ${{ github.head_ref || github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python tools/verification_report.py collect --junit reports/junit.xml --tests tests \
          --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --ref "$REF" \
          --run-url "$RUN_URL" --out reports/verification.json
        python tools/verification_report.py summary reports/verification.json >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the test results
      if: always() && steps.pytest.outcome != 'skipped'
      uses: actions/upload-artifact@v6
      with:
        name: test-results
        path: |
          reports/junit.xml
          reports/verification.json
        retention-days: 90

    - name: Coverage comment
      id: coverage_comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        
    - name: Store Pull Request comment to be posted
      uses: actions/upload-artifact@v6
      if: steps.coverage_comment.outputs.comment_file_written == 'true'
      with:
        # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
        name: python-coverage-comment-action
        # If you use a different name, update COMMENT_FILENAME accordingly
        path: python-coverage-comment-action.txt
        
