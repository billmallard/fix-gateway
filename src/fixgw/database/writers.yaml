# FIX key writer register (ARCHG1, AER-6350).  A design record: the gateway
# never loads this file, and the database format does not change with it.
#
# One entry per key that some module writes:
#   units     the catalog's units (database.yaml)
#   datum     altitude and position keys: the datum each writer puts on the
#             bus.  A mapping is per writer, and where they differ the key is
#             wrong today; `unrecorded` means nobody has read the code yet.
#   writers   live writers in fix-gateway: plugins and compute modules
#   pyefis    live writers in pyEfis (ARCHG2 checks these from pyEfis's side)
#   sim       simulators and replays, which stand in for a live writer
#   relay     modules that pass a client's write on (netfix, command, ...)
#   selector  a compute `select`: `by` picks one of `sources`, and the
#             selector is the key's only live writer
#
# tools/check_key_writers.py checks this file against the code; see
# doc/key_writers.md for how to declare a writer.

ACCELW: {units: warninglevel, writers: [rpi_bno055]}
AGL: {units: ft, datum: {canfix: 'radar altitude, CAN-FIX parameter 0x188', mavlink: 'GLOBAL_POSITION_INT.relative_alt: height above the autopilot''s home, not above ground'}, writers: [canfix, mavlink]}
AIRPRESS: {units: Pa, writers: [mavlink]}
ALAT: {units: g, writers: [canfix, dynon, mavlink, rpi_bno055, stratux]}
ALONG: {units: g, writers: [mavlink, rpi_bno055]}
ALT: {units: ft, datum: {canfix: 'indicated, as the CAN-FIX node sends parameter 0x184', dynon: Dynon serial altitude field when status bit 0 is 0 (the same value goes to TALT); field not checked against Dynon's spec, grand_rapids_eis: 'unrecorded: a raw frame field, protocol not read', mavlink: 'indicated: SCALED_PRESSURE static pressure (plus pascal_offset), ISA pressure altitude less baro_offset_ft(BARO); not written without pressure', rpi_bmp085: sensor altitude at 29.92 plus (BARO - 29.92) * 1000 ft, stratux: Stratux AHRS altitude field less 5000.5 (Stratux documents pressure altitude); not corrected to BARO}, writers: [canfix, dynon, grand_rapids_eis, mavlink, rpi_bmp085, stratux]}
ANORM: {units: g, writers: [mavlink, rpi_bno055]}
AOA: {units: deg, writers: [canfix, onspeed]}
APALTCAP: {units: '', sim: [xplane]}
APALTREF: {units: ft, datum: 'X-Plane''s alt_hold, the altitude the sim''s autopilot holds', sim: [xplane]}
APCAPS: {units: '', sim: [xplane]}
