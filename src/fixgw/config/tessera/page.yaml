# The TESS1 spike page for a Tessera touch panel (doc/plugins/tessera.md).
#
# The panel is 6 keys across and 3 down; id 1 is top left, id 7 starts the
# second row.  Every key draws its centre text (a FIX value with `show`, or
# fixed `text`) inside an empty ring, with `label` underneath.
#
# A press writes only what its key's `press` names:
#   {pulse: KEY}           True then False to a bool key, as a button would.
#                          The TSBTN keys below are pyEfis's own touchscreen
#                          buttons (node 1), so pyEfis runs the action it
#                          already has for them.  pyEfis's stock data
#                          bindings run them on any screen (pyEfis #591);
#                          an older pyEfis acts only while the button shows.
#   {set: KEY, value: V}   one write of V.
# A key with `icon` shows that symbol instead of a value (doc/plugins/tessera.md).
# A key with no `press` answers a touch with a red flash and writes nothing.
name: SPIKE
keys:
  # A press gives pyEfis's knob to the baro setting (baro-focus).
  - {id: 1, label: BARO, show: BARO, format: "{:.2f}", press: {pulse: TSBTN136}}
  - {id: 2, label: BARO, text: "-", press: {pulse: TSBTN11}}    # baro-down-invisible
  - {id: 3, label: BARO, text: "+", press: {pulse: TSBTN12}}    # baro-up-invisible
  # A press gives pyEfis's knob to the heading bug (heading-bug-focus).
  - {id: 4, label: HDG BUG, show: HEADBUG, format: "{:03.0f}", press: {pulse: TSBTN132}}
  - {id: 5, label: HDG, text: "-", press: {pulse: TSBTN129}}    # heading-bug-down
  - {id: 6, label: HDG, text: "+", press: {pulse: TSBTN131}}    # heading-bug-up
  - {id: 7, label: HDG, text: SYNC, press: {pulse: TSBTN130}}   # heading-bug-sync
  - {id: 8, label: CRS, show: COURSE, format: "{:03.0f}"}
  # Shows the CDI source by name, as pyEfis's NAVSRC annunciator does.
  - {id: 9, label: CDI SRC, show: NAVSRC, enum: {0: VLOC1, 1: VLOC2, 2: GPS, 3: GPS2},
     press: {pulse: TSBTN133}}  # cdi-source
  # The map's range ladder index.  A map follows MAPRANGE only if its
  # range_key names it, and each screen's ladder gives the index its range.
  # A press gives pyEfis's knob to the map range (map-range-focus): the inner
  # knob zooms smoothly, the outer ring steps the ladder, a push snaps.
  - {id: 10, label: MAP RANGE, show: MAPRANGE, press: {pulse: TSBTN139}}
  - {id: 11, label: RANGE, text: "-", press: {pulse: TSBTN137}}  # map-range-down
  - {id: 12, label: RANGE, text: "+", press: {pulse: TSBTN138}}  # map-range-up
  # The gear opens pyEfis's system menu (Data Status, About, Screens), the
  # same menu as the corner swipe on the display (MENU1b).
  - {id: 18, label: MENU, icon: settings, press: {pulse: SYSMENU}}
