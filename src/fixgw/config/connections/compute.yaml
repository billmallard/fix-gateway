# Data Computation
compute:
  load: COMPUTE
  module: fixgw.plugins.compute
  functions:
    - function: average
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTAVG1
    - function: span
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTSPAN1
    - function: max
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTMAX1
    - function: max
      inputs: ["CHT11", "CHT12", "CHT13", "CHT14"]
      output: CHTMAX1
    - function: sum
      inputs: ["FUELQ1", "FUELQ2", "FUELQ3"]
      output: FUELQT
    - function: altp
      inputs: ["BARO", "TALT"]
      output: PALT
    - function: altd
      inputs: ["PALT","TALT","OAT"]
      output: DALT
    # Fed GPSCRS (the post-GPSSRC-select canonical GPS course) rather than
    # COURSE (the post-NAVSRC-select canonical course) so XTRACK/GPSBRG stay
    # correct against the active plan/external navigator even while NAVSRC has
    # the HSI showing a VOR (FP1, fix-gateway#22).
    - function: xte
      inputs: ["LAT", "LONG", "WPLAT", "WPLON", "GPSCRS"]
      output: XTRACK
    # HSI bearing pointers (P5b.1). GPS bearing-to-active-waypoint: the great-
    # circle initial bearing from the aircraft (LAT/LONG) to the active waypoint
    # (WPLAT/WPLON), degrees TRUE. Same inputs the xte block already consumes.
    - function: bearing
      inputs: ["LAT", "LONG", "WPLAT", "WPLON"]
      output: GPSBRGT
      require_leader: false
    # Make the GPS bearing magnetic for the magnetic compass rose, exactly like
    # TRACK -> TRACKM: GPSBRG (mag) = GPSBRGT (true) + MAGVAR, wrapped [0,360).
    - function: wrap360
      inputs: ["GPSBRGT", "MAGVAR"]
      output: GPSBRG
      require_leader: false
    # Per-pointer bearing-source selectors, mirroring the NAVSRC/COURSE select.
    # BRG#SRC (0=VOR1, 1=VOR2, 2=GPS) routes one of the three bearing sources
    # into the canonical BRG# the HSI needle reads, so one-key-one-writer holds
    # (each BRG# has exactly one writer, this select). VOR1BRG/VOR2BRG are fed by
    # the active bench source (X-Plane nav#_bearing_deg_mag, see xplane.yaml);
    # the on-aircraft CAN-FiX path (VOR radial 1228/1232 = bearing FROM, so
    # radial + 180 via a wrap360 with a 180 constant) is the follow-on and, being
    # a separate deployment, is the single writer there instead of X-Plane.
    - function: select
      inputs: ["BRG1SRC", "VOR1BRG", "VOR2BRG", "GPSBRG"]
      output: BRG1
      require_leader: false
    - function: select
      inputs: ["BRG2SRC", "VOR1BRG", "VOR2BRG", "GPSBRG"]
      output: BRG2
      require_leader: false
    # Magnetic ground track = true ground track (TRACK) + magnetic variation
    # (MAGVAR), wrapped to [0,360). The HSI compass rose is magnetic (HEAD), so
    # its ground-track diamond must read TRACKM, not TRACK (true) -- otherwise the
    # diamond sits off by the full magnetic variation.
    - function: wrap360
      inputs: ["TRACK", "MAGVAR"]
      output: TRACKM
      require_leader: false
    # GPS guidance source selector (FP1, fix-gateway#22): GPSSRC (0=internal
    # flight plan, 1=external navigator) routes the selected source's
    # course/deviation/TO-FROM into the canonical GPSCRS/GPSCDI/GPSTF that the
    # NAVSRC select below (and the flightplan engine's own consumers) read.
    # This makes the internal plan (FPLCRS/FPLCDI/FPLTF, FP2) and an external
    # navigator (EXTCRS/EXTCDI/EXTTF -- X-Plane's FMS on the bench, a
    # certified GNX in the aircraft) interchangeable sources, the BRGnSRC
    # precedent (compute.py selectFunction).
    - function: select
      inputs: ["GPSSRC", "FPLCRS", "EXTCRS"]
      output: GPSCRS
      require_leader: false
    - function: select
      inputs: ["GPSSRC", "FPLCDI", "EXTCDI"]
      output: GPSCDI
      require_leader: false
    - function: select
      inputs: ["GPSSRC", "FPLTF", "EXTTF"]
      output: GPSTF
      require_leader: false
    # EFIS nav-source selector: NAVSRC (0=NAV1, 1=NAV2, 2=GPS) routes the
    # selected source's course / lateral / vertical deviation into the canonical
    # COURSE / CDI / GSI the HSI + autopilot read. Source order matches NAVSRC:
    # inputs[1]=NAV1, inputs[2]=NAV2, inputs[3]=GPS. require_leader off so it runs
    # without a quorum leader.
    - function: select
      inputs: ["NAVSRC", "NAV1CRS", "NAV2CRS", "GPSCRS"]
      output: COURSE
      require_leader: false
    - function: select
      inputs: ["NAVSRC", "NAV1CDI", "NAV2CDI", "GPSCDI"]
      output: CDI
      require_leader: false
    - function: select
      inputs: ["NAVSRC", "NAV1GSI", "NAV2GSI", "GPSGSI"]
      output: GSI
      require_leader: false
    # Per-source glideslope-valid + TO/FROM, routed to the canonical GSV / TOFROM
    # the HSI reads (GSV=0 hides the GS needle; TOFROM drives the TO/FROM triangle).
    #
    # An ILS glideslope diamond requires BOTH a received glideslope AND a valid
    # localizer -- a real HSI never shows vertical guidance without lateral
    # capture. So for the ILS sources (NAV1/NAV2):
    #   NAV#GSNF = NOT nav#_flag_glideslope    (glideslope actually received)
    #   NAV#GSV  = min(NAV#DH, NAV#GSNF)        (LOC displayed AND GS received)
    # where NAV#DH is X-Plane's nav#_display_horizontal (localizer valid / in
    # range). This suppresses the GS when off the localizer -- turned off the
    # approach, or a false glideslope lobe while climbing out -- matching how
    # X-Plane's own HSI and modern glass behave. GPS/LPV has no separate localizer,
    # so its glidepath follows the flag alone.
    - function: remap
      inputs: ["NAV1GSF"]
      output: NAV1GSNF
      table: [1, 0]
      require_leader: false
    - function: min
      inputs: ["NAV1DH", "NAV1GSNF"]
      output: NAV1GSV
      require_leader: false
    - function: remap
      inputs: ["NAV2GSF"]
      output: NAV2GSNF
      table: [1, 0]
      require_leader: false
    - function: min
      inputs: ["NAV2DH", "NAV2GSNF"]
      output: NAV2GSV
      require_leader: false
    - function: remap
      inputs: ["GPSGSF"]
      output: GPSGSV
      table: [1, 0]
      require_leader: false
    - function: select
      inputs: ["NAVSRC", "NAV1GSV", "NAV2GSV", "GPSGSV"]
      output: GSV
      require_leader: false
    - function: select
      inputs: ["NAVSRC", "NAV1TF", "NAV2TF", "GPSTF"]
      output: TOFROM
      require_leader: false
    # NAVSRC already matches X-Plane's HSI_source_select numbering
    # (0=NAV1, 1=NAV2, 2=GPS), so XPHSISRC is an identity map; the table is kept
    # as the seam that collapses an optional GPS2 (3) onto X-Plane's GPS (2).
    # The xplane plugin's dataref_writes sends XPHSISRC out as a DREF.
    - function: remap
      inputs: ["NAVSRC"]
      output: XPHSISRC
      table: [0, 1, 2]
      require_leader: false
    #   inputs: []
    #   output: x
