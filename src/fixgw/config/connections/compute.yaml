# Data Computation
compute:
  load: COMPUTE
  module: fixgw.plugins.compute
  functions:
    - function: average
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTAVG1
    - function: span
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTSPAN1
    - function: max
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTMAX1
    - function: max
      inputs: ["CHT11", "CHT12", "CHT13", "CHT14"]
      output: CHTMAX1
    - function: sum
      inputs: ["FUELQ1", "FUELQ2", "FUELQ3"]
      output: FUELQT
    - function: altp
      inputs: ["BARO", "TALT"]
      output: PALT
    - function: altd
      inputs: ["PALT","TALT","OAT"]
      output: DALT
    - function: xte
      inputs: ["LAT", "LONG", "WPLAT", "WPLON", "COURSE"]
      output: XTRACK
    # EFIS nav-source selector: NAVSRC (0=GPS, 1=NAV1, 2=NAV2) routes the
    # selected source's course / lateral / vertical deviation into the canonical
    # COURSE / CDI / GSI the HSI + autopilot read. require_leader off so it runs
    # without a quorum leader.
    - function: select
      inputs: ["NAVSRC", "GPSCRS", "NAV1CRS", "NAV2CRS"]
      output: COURSE
      require_leader: false
    - function: select
      inputs: ["NAVSRC", "GPSCDI", "NAV1CDI", "NAV2CDI"]
      output: CDI
      require_leader: false
    - function: select
      inputs: ["NAVSRC", "GPSGSI", "NAV1GSI", "NAV2GSI"]
      output: GSI
      require_leader: false
    # Translate NAVSRC (0=GPS,1=NAV1,2=NAV2) -> X-Plane HSI_source_select
    # (0=NAV1,1=NAV2,2=GPS) so the sim's native autopilot follows the selection.
    # The xplane plugin's dataref_writes sends XPHSISRC out as a DREF.
    - function: remap
      inputs: ["NAVSRC"]
      output: XPHSISRC
      table: [2, 0, 1]
      require_leader: false
