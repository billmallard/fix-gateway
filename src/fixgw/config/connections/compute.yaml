# Data Computation
compute:
  load: COMPUTE
  module: fixgw.plugins.compute
  functions:
    - function: average
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTAVG1
    - function: span
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTSPAN1
    - function: max
      inputs: ["EGT11", "EGT12", "EGT13", "EGT14"]
      output: EGTMAX1
    - function: max
      inputs: ["CHT11", "CHT12", "CHT13", "CHT14"]
      output: CHTMAX1
    - function: sum
      inputs: ["FUELQ1", "FUELQ2", "FUELQ3"]
      output: FUELQT
    - function: altp
      inputs: ["BARO", "TALT"]
      output: PALT
    - function: altd
      inputs: ["PALT","TALT","OAT"]
      output: DALT
    - function: xte
      inputs: ["LAT", "LONG", "WPLAT", "WPLON", "COURSE"]
      output: XTRACK
    # EFIS nav-source selector: NAVSRC (0=GPS, 1=NAV1; add NAV2 inputs later)
    # routes the selected source into the canonical COURSE/CDI the HSI +
    # autopilot read. require_leader off so it runs without a quorum leader.
    - function: select
      inputs: ["NAVSRC", "GPSCRS", "NAV1CRS"]
      output: COURSE
      require_leader: false
    - function: select
      inputs: ["NAVSRC", "GPSCDI", "NAV1CDI"]
      output: CDI
      require_leader: false
