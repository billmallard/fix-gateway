# FlightGear Flight Simulator Module (open-source alternative to X-Plane)
#
# ONE KEY, ONE WRITER. FlightGear writes the same attitude, air data, position
# and nav keys as the X-Plane plugin, and fix-gateway does not arbitrate
# between sources. Never enable FLIGHT_GEAR together with XPLANE or DEMO
# (DEMO is on in the stock preferences.yaml, so turn it off in
# preferences.yaml.custom). The plugin refuses to start if either is loaded.
#
# Start FlightGear with:
#   fgfs --generic=socket,out,10,localhost,5500,udp,fix_fgfs
# and, only if you turn on "send" below, also:
#   --generic=socket,in,10,,5501,udp,fix_fgfs
#
# FlightGear looks for fix_fgfs.xml in $FG_ROOT/Protocol/. Copy or link
# connections/fgfs/fix_fgfs.xml from this config folder there:
#   LINUX: /usr/share/games/flightgear/Protocol/
#   OSX: /Applications/FlightGear.app/Contents/Resources/data/Protocol/
#   WINDOWS: C:\Program Files\FlightGear\data\Protocol\
# Both programs must read the same file. If they differ, the plugin drops
# every sentence and logs the field-count mismatch.
fgfs:
  load: FLIGHT_GEAR
  module: fixgw.plugins.fgfs
  # Where fix-gateway looks for xml_file: fg_root/Protocol/, then fg_root/,
  # then the copy shipped with fix-gateway. The default is the copy in this
  # config folder, which also works under snap.
  fg_root: ~/makerplane/fixgw/config/connections/fgfs
  # fg_root: /usr/share/games/flightgear/
  # fg_root: /Applications/FlightGear.app/Contents/Resources/data/
  # fg_root: c:\Program Files\FlightGear\data\
  xml_file: fix_fgfs.xml
  # Address and port fix-gateway listens on: the --generic "out" connection.
  recv_host: localhost
  recv_port: 5500

  # ---------------------------------------------------------------------
  # FIX -> FlightGear. OFF BY DEFAULT.
  # When on, every <input> chunk in the XML is sent at "rate", whether or not
  # anything publishes the key: an unpublished key sends its initial value.
  # The X-Plane plugin's send path commanded the throttle closed the first
  # time it reached a real port. Only turn this on for keys that real
  # hardware or pyEfis actually drives (the shipped XML sends BARO only).
  # ---------------------------------------------------------------------
  send: false
  # Host and port for the --generic "in" connection.
  send_host: localhost
  send_port: 5501
  rate: 10  # sentences / second
