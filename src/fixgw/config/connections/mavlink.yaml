mavlink:
  load: MAVLINK
  module: fixgw.plugins.mavlink
  type: serial
  baud: 115200
  port: /dev/ttyACM0
  options:
    airspeed: true
    groundspeed: true
    gps: true
    ahrs: true
    accel: true
    pressure: true
    pascal_offset: 2800
    # Write the autopilot state keys (APENG, APLAT, ...) and answer APCMD
    # requests (doc/autopilot_keys.md). Turn it off if another autopilot
    # source writes them.
    autopilot: true

