xplane:
    load: XPLANE
    module: fixgw.plugins.xplane

    # X-Plane host. The simulator must be sending its "Data Output" UDP
    # packets to whichever IP the fix-gateway machine answers on; this
    # field is the destination address fix-gateway sends DREF writes TO.
    ipaddress: 127.0.0.1

    # Local UDP port fix-gateway BINDS to receive X-Plane's data output.
    # Match this against X-Plane's "IP of data receiver" → port.
    udp_in:  49001

    # X-Plane's "Port we receive on" — where fix-gateway SENDS to X-Plane
    # (DATA control writes AND named-dataref RREF requests). In X-Plane's
    # Settings -> Network -> UDP PORTS this is the LEGACY receive port,
    # default 49000. The newer "Port we receive on" (default 49010) does
    # NOT accept the RREF protocol, so it must be the legacy port here.
    # NOTE: X-Plane must allow inbound UDP on this port through the host
    # firewall, or the requests are silently dropped (Data Output still
    # flows, since that's outbound from X-Plane).
    udp_out: 49000

    # Seconds between FIX -> X-Plane bursts. 0.1 = 10 Hz.
    send_interval: 0.1

    # ---------------------------------------------------------------------
    # X-Plane -> FIX. Eight slots per data-output index match the slot
    # order in X-Plane's "Net Connections → Data Set" enable list. Use
    # "_" (or "x" / blank) to skip a slot.
    #
    # Indices below cover the data SVS, AI, HSI, airspeed and altimeter
    # widgets in pyEfis need to behave naturally with X-Plane in the loop.
    # ---------------------------------------------------------------------
    recv:
        # idx 3 — Speeds
        # slots: [Vind_kias, Vind_keas, Vtrue_ktas, Vtrue_ktgs, _, V_mph, ...]
        3:  [IAS, _, TAS, GS, _, _, _, _]

        # idx 4 — Mach, VVI, g-loads
        # slots: [Mach, _, VVI_fpm, Gnormal, Gaxial, Gside, _, _]
        4:  [_, _, VS, _, _, ALAT, _, _]

        # idx 16 — Angular velocities
        # slots: [Qrad_sec, Prad_sec, Rrad_sec, ...]   (pitch/roll/yaw rates)
        16: [_, _, ROT, _, _, _, _, _]

        # idx 17 — Pitch, roll, headings (X-Plane 12 layout verified by capture)
        # slots: [Pitch, Roll, Hdg_true, _, Hdg_mag, MagVar, _, Track]
        # HEAD  = magnetic heading (slot 4) — what the HSI displays.
        # MAGVAR = magnetic variation (slot 5) — used by the AI widget to
        #          derive true heading for SVS geographic projection
        #          (TRUE = HEAD - MAGVAR; positive MAGVAR = west variation).
        17: [PITCH, ROLL, _, _, HEAD, MAGVAR, _, _]

        # idx 18 — AOA, sideslip, paths
        # slots: [alpha, beta, hpath, vpath, _, _, _, _]
        # VPATH = X-Plane's authoritative vertical flight path angle
        # (negative = descending). Matches X-Plane's own FPM symbol;
        # pyEfis uses it directly so the two displays agree even
        # during transient descents where atan2(VS, GS) lags vpath.
        18: [AOA, _, TRACK, VPATH, _, _, _, _]

        # idx 20 — Lat, lon, altitude
        # slots: [lat, lon, alt_ft_msl, alt_ft_agl, _, _, _, _]
        20: [LAT, LONG, ALT, AGL, _, _, _, _]

    # ---------------------------------------------------------------------
    # X-Plane -> FIX via named datarefs (RREF subscriptions). Use for values
    # the indexed "Data Output" rows above don't carry -- notably the nav-radio
    # OBS course and lateral deflection the HSI course bug + CDI need. fix-gateway
    # requests these by name, so X-Plane needs no extra Data Output checkboxes.
    #   FIX_KEY: dataref            -> written as-is
    #   FIX_KEY: [dataref, scale]   -> written * scale
    # Defaults use NAV1; swap nav1_ for nav2_ or gps_ for those sources.
    # ---------------------------------------------------------------------
    datarefs:
        # Selected course (deg mag) -> the magenta course pointer. GPS course by
        # default, matching a magenta GPS CRS on the EFIS. Swap to
        # nav1_obs_degm for a VOR/LOC OBS course, or to
        # sim/cockpit2/radios/indicators/hsi_obs_deg_mag_pilot to auto-follow
        # whichever source the EFIS HSI is currently using.
        COURSE: sim/cockpit/radios/gps_course_degtm
        # Lateral deviation -> the HSI CDI needle. GPS deviation by default to
        # match the GPS course above; swap nav1_/nav2_hdef_dot for a VOR/LOC, or
        # cockpit2/radios/indicators/hsi_hdef_dots_pilot to auto-follow the EFIS
        # source. X-Plane reports +/-2.5 dots full scale and the HSI needle is
        # +/-1.0, so scale by 1/2.5 = 0.4 (use -0.4 if the needle deflects the
        # wrong way).
        CDI: [sim/cockpit/radios/gps_hdef_dot, 0.4]
        # Autopilot selected heading (deg mag) -> cyan heading bug. X-Plane
        # always publishes this (no nav tuning needed), so it doubles as an
        # RREF health check. NOTE: this makes X-Plane drive HEADBUG, so it will
        # override the HDG +/- buttons (which write HEADBUG locally).
        HEADBUG: sim/cockpit/autopilot/heading_mag
    # RREF stream rate (Hz).
    dataref_hz: 10

    # ---------------------------------------------------------------------
    # FIX -> X-Plane.  pyEfis/hardware writes its controls back so a hardware
    # throttle/mixture / autopilot can DRIVE the simulator. Same per-index
    # 8-slot format. Omit a slot with "_" to leave that X-Plane control
    # untouched.
    #
    # DISABLED BY DEFAULT. These rows are sent to udp_out (X-Plane's command
    # port) every send_interval. If the mapped FIX keys are NOT actively driven
    # by real hardware, they read 0 and will command X-Plane's throttle CLOSED
    # and mixture to CUTOFF — killing the engine. Only enable this when a
    # hardware throttle/mixture is genuinely publishing THR1/MIX1. For a normal
    # X-Plane -> pyEfis test (the sim drives the display), leave it commented.
    # ---------------------------------------------------------------------
    # send:
    #     # idx 25 — Throttle command (1.0 = full throttle)
    #     25: [THR1, _, _, _, _, _, _, _]
    #
    #     # idx 29 — Mixture command
    #     29: [MIX1, _, _, _, _, _, _, _]
