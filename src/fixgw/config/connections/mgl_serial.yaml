mgl_serial:
  load: MGL_SERIAL
  module: fixgw.plugins.mgl_serial
  # One writer per key: a channel the TP-3 reports as fuel level (type 4) is
  # written to FUELQT. compute.yaml also writes FUELQT, by summing
  # FUELQ1-FUELQ3. If a fuel-level channel is wired, this plugin owns FUELQT:
  # delete the compute.yaml function whose output is FUELQT, or the two
  # writers fight over the value and its old flag.
  port: /dev/ttyS0
  baud: 57600
  engine_no: 1

