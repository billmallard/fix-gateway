navigator:
  load: NAVIGATOR
  module: fixgw.plugins.navigator_adapter
  # Serial port connected to the navigator RS-232 output
  # Raspberry Pi USB-serial adapter: /dev/ttyUSB0
  # Direct UART on RPi GPIO: /dev/ttyAMA0
  port: /dev/ttyUSB0
  baud: 4800
  # Adapter name — must match a registered ParserAdapter.
  # Built-in: garmin_nmea (Garmin Aviation Output 1 / standard NMEA 0183)
  adapter: garmin_nmea
  # CDI full-scale deflection in nautical miles.
  # Use 5.0 for en-route GPS, 0.3 for GPS approach.
  cdi_full_scale_nm: 5.0
