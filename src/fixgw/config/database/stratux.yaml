# Stratux receiver health and GPS quality (GDL4, AER-5652, CAP-212).
#
# One writer: the stratux plugin's status poller (plugins/stratux/status.py),
# which reads the receiver's `/getStatus` JSON at about 1 Hz from the address
# in `source:` (connections/stratux.yaml).  GDL90 carries none of this.
#
# These keys are the Stratux's own view, prefixed STX so a second GPS never
# fights it (the GDL1 ruling, AER-5615).  They do not feed the generic GPS_*
# keys or the navigator's integrity gate: that is a source select, not this
# block.
#
# A failed poll takes every key old at once, and STXALIVE goes false.  A poll
# that hangs writes nothing, and tol takes the keys old after three missed
# polls.  A field the receiver reports as "no data" is bad: dash it.

items:
- key: STXALIVE
  description: Stratux status feed answering (false and old when the poll fails)
  type: bool
  initial: false
  tol: 3000

- key: STXGPS
  description: Stratux GPS receiver connected
  type: bool
  initial: false
  tol: 3000

- key: STXAHRS
  description: Stratux AHRS (IMU) sensor connected
  type: bool
  initial: false
  tol: 3000

- key: STXBARO
  description: Stratux pressure sensor connected
  type: bool
  initial: false
  tol: 3000

- key: STXGPSFIX
  description: "Stratux GPS solution, GPS_FIX_TYPE scale: 0 no GPS, 1 no fix, 3 3D, 4 3D with SBAS"
  type: int
  min: 0
  max: 5
  initial: 0
  tol: 3000

- key: STXSATS
  description: Stratux GPS satellites used in the solution
  type: int
  min: 0
  max: 200
  initial: 0
  tol: 3000

- key: STXSATSV
  description: Stratux GPS satellites seen (signal received)
  type: int
  min: 0
  max: 200
  initial: 0
  tol: 3000

# Stratux's own figure: HDOP times a receiver-specific factor, called 95 %
# horizontal, not a protection level (HPL) or an HFOM.  Same units and range
# as GPS_ACCURACY_HORIZ.
- key: STXGPSACC
  description: Stratux GPS horizontal accuracy estimate (from HDOP), bad without a 3D fix
  type: float
  units: ft
  min: 0
  max: 100000
  initial: 0
  tol: 3000

- key: STXCPUT
  description: Stratux CPU temperature
  type: float
  units: degC
  min: -50
  max: 150
  initial: 0
  tol: 3000
