items:
# Use this file to add your custom fix database keys
# When the software is updated it might include improvements
# in the other configuration files. By making your customizations
# here those other files wil be updated when you update the software
# This file, once you edit it, will not be overwritten when
# you install updates.
#
# If you want to change a parameter of a fix key, such as setting 
# the max RPM for TACH, do that in the file custom.ini
#
# Here is an example to create an EXAMPLE fix key:
#
- key: EXAMPLE
  description: "Just an example"
  type: str
  initial: "Example value"


# --- Open GCU contract keys (pyEfis docs/gcu_design.md) ---------------------
# Selected altitude (altitude bug). Written by the gcu mapper on user action.
- key: ALTSEL
  description: "Selected Altitude"
  type: int
  min: -1000
  max: 60000
  units: ft
  initial: 3000

# GCU edit focus: which set-point the control-head knobs currently drive.
# Written ONLY by the gcu mapper; displays subscribe to annunciate focus.
# Values: NONE, BARO, HDG, CRS, ALT (extensible).
- key: GCUSEL
  description: "GCU Edit Focus"
  type: str
  initial: "NONE"
