# Flight plan FIX key contract (FP1/FP2, fix-gateway#22/#23; PA3 leg model +
# bus contract, fix-gateway#27; makerplane/briefs/procedures_and_airways_plan.md
# section 3.2 in the maos-workspace repo -- Bill's decision 1, 2026-09-18).
#
# The route crosses the bus as an indexed key block (FPL1..100), the idiom the
# database already expands (EGTec, BTNb): the editor (pyEfis) writes every
# slot, then FPLCOUNT, then bumps FPLSEQ last -- consumers act only on FPLSEQ
# change, so the block is complete when the counter lands (netfix processes
# one connection's writes in order). The `flightplan` engine plugin (FP2) is
# the only writer of the engine-output keys below; the editor's boot-time
# republish after a gateway restart is the one documented exception to
# one-key-one-writer (mirrors state_persist restoring NAVSRC).
#
# PA3 replaced the point-only slot (FPLfID/LAT/LON/TYPE/ROLE) with a
# leg-typed one: a slot now carries a path terminator, course, distance,
# altitude/speed constraint and a flags bitfield, so a SID/STAR/approach
# (a sequence of legs) can round-trip through the same block an enroute
# route uses (a flat list of points is just every slot's FPLfPT = "TF").
# Provenance for a loaded procedure lives at block level (FPLDPID/
# FPLSTARID/FPLAPRID/FPLAPRTYPE/FPLDBCYC), not copied onto every slot --
# see doc/flightplan_keys.md for the reasoning. Per Bill's ruling, this is
# a breaking change from FP1's key spellings (guardrail 6 struck -- the
# feature has no consumers outside dev yet).
#
# GPSSRC lets the internal plan and an external navigator (X-Plane's FMS on
# the bench; a certified GNX in the aircraft) be interchangeable sources for
# GPSCRS/GPSCDI/GPSTF via a compute `select` (connections/compute.yaml),
# exactly like NAVSRC/BRGnSRC already select into COURSE/CDI/TOFROM and
# BRG1/BRG2.
#
# See doc/flightplan_keys.md for every key's writer and sign convention.

items:

# --- Route block (editor writes; tol: 0; persisted by the engine) ----------
- key: FPLfID
  description: Flight plan slot %f ident
  type: str
  initial: ""
  tol: 0

- key: FPLfLAT
  description: Flight plan slot %f latitude
  type: float
  min: -90
  max: 90
  units: deg
  initial: 0.0
  tol: 0

- key: FPLfLON
  description: Flight plan slot %f longitude
  type: float
  min: -180
  max: 180
  units: deg
  initial: 0.0
  tol: 0

- key: FPLfTYPE
  description: "Flight plan slot %f type (0 unknown, 1 airport, 2 VOR, 3 NDB, 4 fix, 5 user, 6 map point)"
  type: int
  min: 0
  max: 6
  initial: 0
  tol: 0

- key: FPLfPT
  description: "Flight plan slot %f path terminator (ARINC 424 2-char code, e.g. TF/IF/CF/DF/CA/RF/AF/HM -- \"TF\" = a great-circle point-to-point leg, the enroute default)"
  type: str
  initial: "TF"
  tol: 0

- key: FPLfCRS
  description: "Flight plan slot %f leg course (magnetic -- CF/CA/FC/VA/VM/VI course-terminated legs)"
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 0

- key: FPLfDST
  description: "Flight plan slot %f leg distance (nm -- minutes for a time-terminated leg, HM/HF/HA, Tier 2)"
  type: float
  min: 0.0
  max: 999.9
  initial: 0.0
  tol: 0

- key: FPLfALT
  description: 'Flight plan slot %f altitude constraint, packed (guide notation): "" none, "+3500" at-or-above, "-3500" at-or-below, "B2900,4000" between, "@3500" at'
  type: str
  initial: ""
  tol: 0

- key: FPLfSPD
  description: "Flight plan slot %f speed constraint, kt (0 = none)"
  type: int
  min: 0
  max: 400
  initial: 0
  tol: 0

- key: FPLfSEG
  description: "Flight plan slot %f procedure segment (0 enroute, 1 departure, 2 arrival, 3 approach, 4 missed)"
  type: int
  min: 0
  max: 4
  initial: 0
  tol: 0

- key: FPLfFLAGS
  description: "Flight plan slot %f flags bitfield (0x01 fly-over, 0x02 IAF, 0x04 FAF, 0x08 MAP, 0x10 MAHP, 0x20 from a coded procedure)"
  type: int
  min: 0
  max: 63
  initial: 0
  tol: 0

- key: FPLCOUNT
  description: Flight plan slots in use
  type: int
  min: 0
  max: 100
  initial: 0
  tol: 0

- key: FPLNAME
  description: "Flight plan route name (<=32 chars, no semicolons)"
  type: str
  initial: ""
  tol: 0

- key: FPLSEQ
  description: Flight plan commit counter, written last after every slot + FPLCOUNT
  type: int
  min: 0
  max: 2147483647
  initial: 0
  tol: 0

# --- Loaded-procedure provenance (block-level; editor writes) --------------
# Off the slot on purpose (PA3/Bill 2026-09-18): one fact per procedure, not
# up to 100 copies of the same string. FPLfSEG says which of these a given
# slot belongs to.
- key: FPLDPID
  description: "Loaded departure (SID) procedure ident, e.g. \"HYDRR6\" (<=8 chars, \"\" = none)"
  type: str
  initial: ""
  tol: 0

- key: FPLSTARID
  description: "Loaded arrival (STAR) procedure ident (<=8 chars, \"\" = none)"
  type: str
  initial: ""
  tol: 0

- key: FPLAPRID
  description: "Loaded approach procedure ident, e.g. \"I33L\" (<=8 chars, \"\" = none)"
  type: str
  initial: ""
  tol: 0

- key: FPLAPRTYPE
  description: "Loaded approach type (ILS/LOC/RNAV/VOR/NDB/GPS..., <=8 chars, \"\" = none)"
  type: str
  initial: ""
  tol: 0

- key: FPLDBCYC
  description: "Navigation database AIRAC cycle the loaded procedure(s) came from, e.g. \"2609\" (<=8 chars) -- PA9 annunciates when it has expired"
  type: str
  initial: ""
  tol: 0

# --- Direct-To staging (editor writes) --------------------------------------
- key: DTOID
  description: Direct-to staged target ident
  type: str
  initial: ""
  tol: 0

- key: DTOLAT
  description: Direct-to staged target latitude
  type: float
  min: -90
  max: 90
  units: deg
  initial: 0.0
  tol: 0

- key: DTOLON
  description: Direct-to staged target longitude
  type: float
  min: -180
  max: 180
  units: deg
  initial: 0.0
  tol: 0

- key: DTOTYPE
  description: "Direct-to staged target type (0 unknown, 1 airport, 2 VOR, 3 NDB, 4 fix, 5 user, 6 map point)"
  type: int
  min: 0
  max: 6
  initial: 0
  tol: 0

# --- Command channel (editor writes FPLCMD; engine answers) ----------------
- key: FPLCMD
  description: 'Flight plan command "<seq> VERB [arg]" (ACT/DTO/DTOX/SUSP/RESUME/SCALE -- PROC/PROCX/AWY reserved for procedure/airway loading, PA3, not yet dispatched by this engine)'
  type: str
  initial: ""
  tol: 0

- key: FPLCMDACK
  description: Flight plan command ack (= seq on success, -seq on rejection)
  type: int
  min: -2147483648
  max: 2147483647
  initial: 0
  tol: 0

- key: FPLMSG
  description: "Flight plan last message / rejection reason (<=64 chars)"
  type: str
  initial: ""
  tol: 0

# --- Engine outputs (engine writes; tol: 5000) ------------------------------
- key: FPLSTATE
  description: "Flight plan state (0 NONE, 1 LEG, 2 DIRECT, 3 SUSP)"
  type: int
  min: 0
  max: 3
  initial: 0
  tol: 5000

- key: FPLACTLEG
  description: Flight plan active (TO waypoint) slot, 0 = none
  type: int
  min: 0
  max: 100
  initial: 0
  tol: 5000

- key: FPLPHASE
  description: "Flight phase annunciation (ENR/TERM/LNAV/LOI/0.30 NM/1.00 NM/empty)"
  type: str
  initial: ""
  tol: 5000

- key: FPLAPR
  description: "Approach state (0 none, 1 armed, 2 active, 3 missed)"
  type: int
  min: 0
  max: 3
  initial: 0
  tol: 5000

- key: FPLINTEG
  description: Flight plan integrity gate satisfied for the current phase
  type: bool
  initial: true
  tol: 5000

- key: CDISCALE
  description: CDI full-scale deflection (ramps 1.0 -> 0.3 nm before the FAF)
  type: float
  min: 0.3
  max: 2.0
  units: nM
  initial: 2.0
  tol: 5000

- key: FPLCRS
  description: Flight plan desired track (magnetic)
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 5000

- key: FPLXTK
  description: Flight plan cross-track error, positive = right of track
  type: float
  min: -100.0
  max: 100.0
  units: nM
  initial: 0.0
  tol: 5000

- key: FPLCDI
  description: "Flight plan course deviation: -FPLXTK / CDISCALE, clamped"
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 5000

- key: FPLTF
  description: "Flight plan TO/FROM (0 off, 1 TO, 2 FROM)"
  type: int
  min: 0
  max: 2
  initial: 0
  tol: 5000

- key: FPLFRLAT
  description: Flight plan active leg FROM point latitude
  type: float
  min: -90
  max: 90
  units: deg
  initial: 0.0
  tol: 5000

- key: FPLFRLON
  description: Flight plan active leg FROM point longitude
  type: float
  min: -180
  max: 180
  units: deg
  initial: 0.0
  tol: 5000

- key: WPFROM
  description: "Flight plan FROM waypoint ident (<=6 chars)"
  type: str
  initial: ""
  tol: 5000

- key: WPNEXT
  description: "Flight plan NEXT waypoint ident (<=6 chars)"
  type: str
  initial: ""
  tol: 5000

- key: WPDIS
  description: Flight plan distance to the TO waypoint
  type: float
  min: 0.0
  max: 9999.9
  units: nM
  initial: 0.0
  tol: 5000

- key: WPETE
  description: "Flight plan time to the TO waypoint (bad when GS < 30 kt)"
  type: int
  min: 0
  max: 86400
  units: s
  initial: 0
  tol: 5000

- key: FPLREMDIS
  description: Flight plan remaining distance to end of plan
  type: float
  min: 0.0
  max: 9999.9
  units: nM
  initial: 0.0
  tol: 5000

- key: FPLREMETE
  description: Flight plan remaining time to end of plan
  type: int
  min: 0
  max: 86400
  units: s
  initial: 0
  tol: 5000

- key: FPLALERT
  description: Flight plan waypoint sequencing alert
  type: bool
  initial: false
  tol: 5000

# --- GPS guidance source selection ------------------------------------------
# 0 = internal plan (FPLCRS/FPLCDI/FPLTF), 1 = external navigator
# (EXTCRS/EXTCDI/EXTTF). Persisted by state_persist, the BRGnSRC/NAVSRC
# precedent.
- key: GPSSRC
  description: "GPS guidance source (0 = internal plan, 1 = external navigator)"
  type: int
  min: 0
  max: 1
  initial: 0
  tol: 0

- key: EXTCRS
  description: External navigator course (magnetic)
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 5000

- key: EXTCDI
  description: External navigator course deviation
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 5000

- key: EXTTF
  description: "External navigator TO/FROM (0 off, 1 TO, 2 FROM)"
  type: int
  min: 0
  max: 2
  initial: 0
  tol: 5000
