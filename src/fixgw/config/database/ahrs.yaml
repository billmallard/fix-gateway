  max: 2000.0
  units: knots
  initial: 0.0
  tol: 2000

- key: ALT
  description: Indicated Altitude
  type: float
  min: -2000.0
  max: 60000.0
  units: ft
  initial: 0.0
  tol: 2000

- key: PALT
  description: Pressure Altitude
  type: float
  min: -1000.0
  max: 60000.0
  units: ft
  initial: 0.0
  tol: 2000

- key: TALT
  description: True Altitude
  type: float
  min: -1000.0
  max: 60000.0
  units: ft
  initial: 0.0
  tol: 2000

- key: DALT
  description: Density Altitude
  type: float
  min: -1000.0
  max: 60000.0
  units: ft
  initial: 0.0
  tol: 2000

- key: AGL
  description: Radar Altitude (Above Ground Level)
  type: float
  min: -1000.0
  max: 60000.0
  units: ft
  initial: 0.0
  tol: 2000

- key: BARO
  description: Altimeter Setting
  type: float
  min: 0.0
  max: 35.0
  units: inHg
  initial: 29.92

- key: AIRPRESS
  description: Air Pressure
  type: float
  min: 0.0
  max: 200000.0
  units: Pa
  initial: 101325.0
  tol: 2000

- key: DIFFAIRPRESS
  description: Differential Air Pressure
  type: float
  min: 0.0
  max: 200000.0
  units: Pa
  initial: 101325.0
  tol: 2000

- key: VS
  description: Vertical Speed
  type: float
  min: -30000.0
  max: 30000.0
  units: ft/min
  initial: 0.0
  tol: 2000
  aux: [Min,Max]

- key: HEAD
  description: Current Aircraft Magnetic Heading
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: HEADBUG
  description: Selected Heading Bug
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: MAGVAR
  description: Local Magnetic Variation (positive = west variation, MAG = TRUE + VAR)
  type: float
  min: -30.0
  max: 30.0
  units: deg
  initial: 0.0
  tol: 60000

- key: VPATH
  description: Vertical Flight Path Angle (negative = descending). Authoritative
    when source can compute it from instantaneous velocity components (e.g. a sim
    or AHRS with inertial state); pyEfis FPM falls back to atan2(VS, GS) when
    VPATH is not published.
  type: float
  min: -90.0
  max: 90.0
  units: deg
  initial: 0.0
  tol: 2000

- key: TRACK
  description: Current Aircraft Bearing
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: TRACKM
  description: Current Aircraft Magnetic Bearing
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: COURSE
  description: Selected Course
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: CDI
  description: Course Deviation Indicator
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: GSI
  description: Glideslope Indicator
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

# Nav-source selector + per-source course / lateral / vertical deviation. A
# button cycles NAVSRC; the compute "select" routes the chosen source into the
# canonical COURSE/CDI/GSI the HSI and autopilot read. max = the cycle modulus
# (3 sources) so change-value-wrap steps 0 -> 1 -> 2 -> 0.
#
# Ordering is bus-native: 0=NAV1, 1=NAV2, 2=GPS matches CAN-FiX OBI Flags (id 450
# b1:b2) and X-Plane's HSI_source_select, so XPHSISRC is an identity map (no table
# inversion) and a real nav radio's OBI Flags decodes straight into NAVSRC.
# initial 2.0 keeps the boot default on GPS. Extensible to 3=GPS2 (max 4).
- key: NAVSRC
  description: Selected Nav Source (0=NAV1, 1=NAV2, 2=GPS)
  type: float
  min: 0.0
  max: 3.0
  initial: 2.0
  tol: 2000

- key: GPSCRS
  description: GPS Course
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: GPSCDI
  description: GPS Course Deviation
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: NAV1CRS
  description: NAV1 OBS Course
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: NAV1CDI
  description: NAV1 Course Deviation
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: NAV2CRS
  description: NAV2 OBS Course
  type: float
  min: 0.0
  max: 359.9
  units: deg
  initial: 0.0
  tol: 2000

- key: NAV2CDI
  description: NAV2 Course Deviation
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: GPSGSI
  description: GPS Vertical Deviation (glidepath)
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: NAV1GSI
  description: NAV1 Glideslope Deviation
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: NAV2GSI
  description: NAV2 Glideslope Deviation
  type: float
  min: -1.0
  max: 1.0
  initial: 0.0
  tol: 2000

# Glideslope/glidepath validity per source (1 = GS present, 0 = none). A VOR has
# no glideslope, so the HSI hides the GS needle when the selected source's GSV is
# 0. From X-Plane's nav#_display_vertical indicators; a real GPS / nav radio
# reports it directly.
- key: NAV1GSV
  description: NAV1 vertical guidance valid (1=GS present)
  type: float
  min: 0.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: NAV2GSV
  description: NAV2 vertical guidance valid (1=GS present)
  type: float
  min: 0.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: GPSGSV
  description: GPS vertical guidance valid (1=glidepath present)
  type: float
  min: 0.0
  max: 1.0
  initial: 0.0
  tol: 2000

- key: GSV
  description: Selected-source glideslope/glidepath valid (1=show GS needle)
  type: float
  min: 0.0
  max: 1.0
  initial: 0.0
  tol: 2000

# VOR TO/FROM per source (0=off/flag, 1=TO, 2=FROM). From X-Plane nav#_fromto;
# GPS has no TO/FROM so GPSTF stays 0. The HSI draws a TO/FROM triangle on the
# course line for the selected source.
- key: NAV1TF
  description: NAV1 TO/FROM (0=off, 1=TO, 2=FROM)
  type: float
  min: 0.0
  max: 2.0
  initial: 0.0
  tol: 2000

- key: NAV2TF
  description: NAV2 TO/FROM (0=off, 1=TO, 2=FROM)
  type: float
  min: 0.0
  max: 2.0
  initial: 0.0
  tol: 2000

- key: GPSTF
  description: GPS TO/FROM (always 0; GPS has no TO/FROM)
  type: float
  min: 0.0
  max: 2.0
  initial: 0.0
  tol: 2000

- key: TOFROM
  description: Selected-source TO/FROM (0=off, 1=TO, 2=FROM)
  type: float
  min: 0.0
  max: 2.0
  initial: 0.0
  tol: 2000

- key: XPHSISRC
  description: X-Plane HSI source index (0=NAV1, 1=NAV2, 2=GPS); = NAVSRC (identity map)
  type: float
  min: 0.0
  max: 2.0
  initial: 2.0
  tol: 2000

- key: XTRACK
  description: Signed Cross Track Error (left/right of desired course)
  type: float
  min: -100.0
  max: 100.0
  units: nM
  initial: 0.0
  tol: 2000

- key: ROT
  description: Rate of Turn
  type: float
  min: -3000
  max: 3000
  units: Deg/sec
  initial: 0.0
  tol: 300

- key: ROLL
  description: Roll Angle
  type: float
  min: -180.0
  max: 180.0
  units: deg
  initial: 0.0
  tol: 300

- key: PITCH
  description: Pitch Angle
  type: float
  min: -90.0
  max: 90.0
  units: deg
  initial: 0.0
  tol: 300

- key: ORISYSW
