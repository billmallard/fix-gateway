# This is where you define how many engines you have and such
# You could also add additional variables too
variables:
  e: 1  # Engines
  c: 6  # Cylinders
  a: 8  # Generic Analogs
  b: 30 # Generic Buttons
  g: 4  # Egt Buttons
  r: 5  # Encoders
  t: 3  # Fuel Tanks
  n: 5  # Nodes
  s: 40 # Touchscreen buttons
  d: 4  # MGL V16 Radios
  w: 3  # Wheels
  f: 100 # Flight plan route slots AND segment-table rows (PA3: raised from 50, matches the GNX's 100-waypoint limit; RS1 indexes FPLSf* on it too)
  k: 32 # ADS-B traffic slots, TFC1..32 (AER-4579; GDL90's guaranteed minimum target count, G§3.5)
