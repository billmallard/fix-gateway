# TALT: a sanctioned addition (Bill, card 82b0b10b on AER-6458, 2026-11-24).
# garmin_gnx375, gpsd and navigator_adapter moved their MSL write here off
# GPS_ELLIPSOID_ALT, which named the wrong datum; the baseline's writer
# entries fell (GPS_ELLIPSOID_ALT left it). It holds only while
# test_talt_has_the_position_writers (tests/arch/test_key_writers.py) passes:
