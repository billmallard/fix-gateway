# FPLCMD: a sanctioned addition (Bill, card bc9865d2 on AER-6518, 2026-11-25).
# A seq-arbitrated command channel, not a second source: the pyEfis editor's
# fixbridge.command and the HSI's _send_fpl_command each send one past the
# highest seq on the bus (the last FPLCMD or FPLCMDACK), and acks are matched
# by seq. The HSI keeps its own copy of the rule because rule R1 bars core from
# importing the flight-plan package; a pyEfis test (test_hsi_gps_obs.py) holds
# the two copies together. A selector cannot apply: a command has no source to
# choose between.
FPLCMD: [pyefis/flightplan, pyefis/instruments/hsi]
