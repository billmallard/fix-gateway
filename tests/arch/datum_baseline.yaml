# Keys whose writers put more than one datum on the bus today (SRC4,
# AER-6455): each writer and the datum it declares in
# src/fixgw/database/writers.yaml.  `unrecorded` and `unstated` never
# agree, so a key with one of them and a second writer is here too.
# tests/arch/test_key_writers.py fails when a key not listed here
# declares two datums, and when a listed key's writers or datums change
# -- so this file only shrinks.  Remove an entry by giving each datum its
# own key (GALT1) or by fixing the writer (MAVALT1).
# 7 keys.

AGL: {canfix: above_ground, mavlink: above_home}
ALT: {canfix: indicated, demo: msl, dynon: indicated, fgfs: msl, grand_rapids_eis: unrecorded, mavlink: indicated, onspeed: indicated, rpi_bmp085: indicated, stratux: pressure, xplane: msl}
GPS_ACCURACY_HORIZ: {demo: assumed, gpsd: unstated, mavlink: unstated}
GPS_ACCURACY_SPEED: {gpsd: unstated, mavlink: unstated}
GPS_ACCURACY_VERTICAL: {gpsd: unstated, mavlink: unstated}
HEAD: {canfix: magnetic, demo: unrecorded, fgfs: magnetic, mavlink: 'true', rpi_bno055: magnetic, stratux: unrecorded, xplane: magnetic}
TRACK: {demo: unrecorded, fgfs: 'true', garmin_gnx375: 'true', gpsd: 'true', mavlink: 'true', navigator_adapter: 'true', xplane: 'true'}
